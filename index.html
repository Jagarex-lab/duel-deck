<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1021"><title>Duel Deck — Card Arena</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;--bg:#090e1d;--panel:#141c32;--panel2:#1b2743;--edge:#344466;--gold:#f5c56d;--text:#f4f5fc;--muted:#a7b4d0;--green:#79dfac;--red:#ff8d9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25345b 0,#10172c 45%,#080c19 100%);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100dvh}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:620px;margin:auto;padding:18px 15px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;font-size:23px;letter-spacing:.4px}.logo span{color:var(--gold)}.currency{font-size:14px;background:#25304b;border:1px solid #465779;border-radius:24px;padding:9px 12px;color:var(--gold);font-weight:800}.sub{color:var(--muted);font-size:13px;margin:5px 0 16px}.panel{background:linear-gradient(145deg,rgba(29,40,68,.98),rgba(15,22,42,.98));border:1px solid var(--edge);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 12px 32px #0003}.eyebrow{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;font-weight:900}.heading{font-size:23px;font-weight:900;margin:7px 0}.small{font-size:13px;color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#111b32;border:1px solid #31415f;border-radius:13px;padding:11px;text-align:center}.stat b{display:block;font-size:20px;color:#fff}.stat span{font-size:11px;color:var(--muted)}.btn{border:0;background:linear-gradient(125deg,#f7d17c,#e6a951);color:#201a17;border-radius:12px;padding:13px 17px;font-weight:900;box-shadow:0 5px 18px #efb95b22}.btn.alt{background:#273858;color:#fff;border:1px solid #465d84;box-shadow:none}.btn.danger{background:#5b2940;color:#ffe5e8}.btn:active,.card:active{transform:scale(.98)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.bar{height:10px;border-radius:20px;background:#101525;overflow:hidden;border:1px solid #384363}.bar>div{height:100%;background:linear-gradient(90deg,#ed657b,#ffb07c);transition:width .3s}.bar.hero>div{background:linear-gradient(90deg,#4fb5a3,#9df2c1)}.combatants{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fighter{padding:14px;border:1px solid #415274;border-radius:16px;background:#111c33}.avatar{font-size:43px;text-align:center;margin:8px 0}.fighter b{font-size:14px}.health{display:flex;justify-content:space-between;font-size:12px;margin:9px 0 6px}.intent{font-size:12px;color:#ffd19c;min-height:32px;margin-top:9px}.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{position:relative;min-height:174px;background:linear-gradient(150deg,#32486d,#19243c 80%);border:2px solid #58739e;border-radius:14px;padding:10px 7px;text-align:center;color:white;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;box-shadow:0 9px 18px #0004}.card.rare{background:linear-gradient(150deg,#4a3a7c,#202344 85%);border-color:#b38df4}.card.epic{background:linear-gradient(150deg,#755129,#302139 85%);border-color:#f5c56d}.card .emoji{font-size:39px;margin-top:10px}.card .name{font-size:12px;font-weight:900;line-height:1.15;min-height:29px}.card .desc{font-size:10px;line-height:1.3;color:#d3dff3}.cost{position:absolute;top:-9px;left:-6px;background:#66b6f7;color:#10233b;font-size:13px;font-weight:900;border:2px solid #c7eaff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}.rarity{font-size:9px;letter-spacing:1px;color:#e6d0ff;margin-top:auto}.section{font-weight:900;font-size:17px;margin:19px 0 10px}.log{max-height:145px;overflow:auto;font-size:12px;line-height:1.65;color:#bdcbe6}.log div{border-bottom:1px solid #ffffff0b;padding:3px 0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0e1629ee;border-top:1px solid #3b4c6a;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(18px);z-index:5}.tabs>div{display:flex;max-width:620px;width:100%;gap:7px}.tab{flex:1;background:none;border:0;color:#9caac6;font-size:11px;padding:8px 2px;border-radius:12px}.tab.active{background:#273858;color:var(--gold);font-weight:900}.tab i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}.collection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.collection .card{min-height:150px}.tag{font-size:11px;background:#273858;border-radius:20px;padding:5px 9px;color:#bfcce5}.notice{border-left:3px solid var(--gold);padding:10px 12px;background:#3b3141;color:#ffe4a7;border-radius:8px;font-size:12px;margin:10px 0}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#f3d086;color:#211b1b;padding:12px 20px;border-radius:12px;font-weight:800;z-index:10;max-width:90%;text-align:center;box-shadow:0 10px 30px #0008}.hidden{display:none!important}@media(max-width:370px){.app{padding:12px 9px 110px}.card{min-height:165px}.card .emoji{font-size:31px}.card .name{font-size:11px}}
</style></head><body><main id="app" class="app"></main><nav class="tabs"><div><button class="tab" data-tab="battle"><i>⚔️</i>Duell</button><button class="tab" data-tab="collection"><i>🃏</i>Sammlung</button><button class="tab" data-tab="shop"><i>🎁</i>Shop</button><button class="tab" data-tab="profile"><i>🏆</i>Profil</button></div></nav><div id="toast" class="toast hidden"></div><script src="game.js"></script></body></html>
